name: Services
status: stable
type: component
description: "Services section with heading, description and service cards."

props:
  title:
    type: string
    default: "Services"
  description:
    type: string
    default: "At our digital marketing agency, we offer a range of services to help businesses grow and succeed online. These services include:"
  services:
    type: array
    items:
      type: object
      properties:
        title:
          type: string
        image:
          type: string
        highlight:
          type: boolean
          default: false
