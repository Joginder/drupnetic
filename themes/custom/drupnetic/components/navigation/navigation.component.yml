sdc:
  id: navigation
  label: 'Navigation'
  description: 'A navigation menu component.'
  category: 'Layout'
  fields:
    menu_items:
      type: list
      label: 'Menu Items'
      description: 'List of navigation links.'
      item:
        type: group
        fields:
          title:
            type: text
            label: 'Link Title'
          url:
            type: url
            label: 'Link URL'
          target:
            type: select
            label: 'Link Target'
            options:
              - '_self'
              - '_blank'
  variants:
    - id: default
      label: 'Default'